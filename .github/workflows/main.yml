name: build
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  run:
    name: Build # build+test on various versions of OCaml, on linux
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        container:
          - ghcr.io/c-cube/c-cube-commmon/ci-4.14:latest
          - ghcr.io/c-cube/c-cube-commmon/ci-5.1:latest
          - ghcr.io/c-cube/c-cube-commmon/ci-5.4:latest
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v6
      - run: opam pin -n .
      - run: opam depext -yt printbox printbox-html printbox-md printbox-text
      - run: opam install -t . --deps-only
      - run: opam exec -- dune build @all
      - run: opam exec -- dune runtest
